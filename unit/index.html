<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unit Resolution</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="unit.css">
</head>
<body>

<section id="hook">
  <p id="hook-line" aria-live="polite">Which one is darker?</p>
  <div id="stage">
    <div id="ground"><div id="flat"></div></div>
    <div class="patch" id="patch-a"></div>
    <div class="patch" id="patch-b"></div>
  </div>
  <div id="hook-foot">
    <div id="hook-before">
      <p id="hook-hint">Drag one onto the other.</p>
      <button id="together" type="button">Bring them together</button>
    </div>
    <div id="hook-after">
      <p id="hook-close">It took the shortest route to an answer. Usually that works.</p>
      <button id="see" type="button">See how</button>
    </div>
  </div>
</section>

<section id="field" hidden>
  <canvas id="net"></canvas>
  <div id="panel">
    <div id="guide">
      <p id="say" aria-live="polite"></p>
    </div>
    <div id="controls">
      <button id="touch" type="button">Touch</button>
      <div id="dial">
        <input id="slider" type="range" min="0" max="1000" step="1" value="500" aria-labelledby="mark-a mark-b mark-c">
        <div id="marks" aria-hidden="true">
          <span id="mark-a">All at once</span>
          <span id="mark-b">By situation</span>
          <span id="mark-c">Everywhere</span>
        </div>
      </div>
      <button id="situation" type="button">Change the situation</button>
    </div>
  </div>
</section>

<script src="unit.js"></script>
</body>
</html>
